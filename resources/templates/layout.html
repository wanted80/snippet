<!doctype html>
<html lang="{{language}}">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; form-action 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'">
        <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover">
        <meta name="format-detection" content="telephone=no">
        <meta name="description" content="{{description}}">
        <meta name="author" content="{{author}}">
        <meta name="generator" content="Snippet {{version}}">
        <meta name="theme-color" content="#08090a">
        <meta name="color-scheme" content="dark light">
        <link rel="icon" href="{{base_path}}/favicon.svg" type="image/svg+xml">
        {{theme_script}}
        {{site_script}}
        <title>{{title}}</title>
        <link rel="canonical" href="{{canonical}}">
        {{social_metadata}}
        {{preloads}}
        {{theme_stylesheet}}
        {{site_stylesheet}}
    </head>
    <body>
        <a class="skip-link" href="#main">Skip to content</a>
        <header class="site-header" data-site-header>
            <button class="menu-toggle icon-button" type="button" popovertarget="site-navigation" aria-controls="site-navigation" aria-label="Open navigation" title="Open navigation">
                <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path class="menu-icon-open" d="M4 7.25h16M4 12h16M4 16.75h16"/>
                    <path class="menu-icon-close" d="m5.75 5.75 12.5 12.5m0-12.5-12.5 12.5"/>
                </svg>
            </button>
            <a class="site-brand" href="{{base_path}}/" aria-label="{{sitename}} — Home"><span class="site-wordmark">{{sitename}}</span></a>
            <button class="theme-toggle icon-button" type="button" data-theme-toggle aria-label="Toggle color theme" title="Toggle color theme">
                <svg class="menu-icon theme-icon-light" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M12 2.75v2.1M12 19.15v2.1M21.25 12h-2.1M4.85 12h-2.1M18.54 5.46l-1.48 1.48M6.94 17.06l-1.48 1.48M18.54 18.54l-1.48-1.48M6.94 6.94 5.46 5.46M16.25 12A4.25 4.25 0 1 1 7.75 12a4.25 4.25 0 0 1 8.5 0Z"/>
                </svg>
                <svg class="menu-icon theme-icon-dark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M20.2 15.2A8.75 8.75 0 0 1 8.8 3.8 8.76 8.76 0 1 0 20.2 15.2Z"/>
                    <path d="m17.5 3 .45 1.05L19 4.5l-1.05.45L17.5 6l-.45-1.05L16 4.5l1.05-.45L17.5 3Z"/>
                </svg>
            </button>
            <nav class="site-navigation" id="site-navigation" popover aria-label="Primary">
                <div class="menu-links">
                    {{navigation}}
                </div>
            </nav>
        </header>
        <main class="site-main" id="main">
            {{body}}
        </main>
        <footer class="site-footer">
            {{profiles}}
            <p><a href="{{base_path}}/llms.txt">llms.txt</a></p>
            <p class="site-footer-row"><span>Generated and published with</span><svg class="site-footer-heart" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 21 3.4 12.5a5.5 5.5 0 0 1 7.8-7.8l.8.8.8-.8a5.5 5.5 0 0 1 7.8 7.8Z"/></svg><span>by</span><span class="site-footer-link"><a href="https://github.com/wanted80/snippet"><span>Snippet</span></a>.</span></p>
        </footer>
    </body>
</html>
