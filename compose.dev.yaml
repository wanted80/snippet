name: snippet-dev

services:
  app:
    build:
      target: development
    image: ${IMAGE:-snippet}:${TAG:-local}-development-${LOCAL_UID:-${SNIPPET_HOST_UID:-1000}}-${LOCAL_GID:-${SNIPPET_HOST_GID:-1000}}
    environment:
      ENVIRONMENT: development
    command:
      - sleep
      - infinity
    volumes:
      - vendor-development:/app/vendor
      - node-development:/app/node_modules
