version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    commit-message:
      prefix: build
      include: scope
    groups:
      composer-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    commit-message:
      prefix: build
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directories:
      - /
      - /docker/builder
      - /docker/development
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    ignore:
      # Track the stable PHP minor line through digest updates.
      - dependency-name: php
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    commit-message:
      prefix: build
      include: scope
    groups:
      docker-images:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    commit-message:
      prefix: build
      include: scope
    groups:
      npm-dependencies:
        patterns:
          - "*"
