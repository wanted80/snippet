name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: quality-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate development Compose configuration
        run: make docker-config

      - name: Validate production Compose configuration
        run: ENVIRONMENT=production make docker-config

      - name: Run development quality gate
        run: make docker-check

      - name: Smoke-test release builder image
        run: make builder-smoke

      # Report-only until the repository has an evidence-based exception policy.
      - name: Report builder image OS vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: snippet-builder:smoke
          format: table
          vuln-type: os
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          version: v0.70.0
          cache: false

      - name: Validate and build the composed demo site
        run: make demo-check

      - name: Audit locked dependencies
        run: make docker-audit
